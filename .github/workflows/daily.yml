name: Archivio completo delle partite

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - '.github/workflows/daily.yml'
      - 'scanner/archive.py'
      - 'scanner/scan.py'
      - 'live/archive.js'
      - 'live/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collega la vista archivio alla pagina
        run: |
          grep -q 'archive.js' live/index.html || sed -i '/<\/body>/i <script src="archive.js"></script>' live/index.html
      - name: Aggiorna la lista originale di partite con statistiche prematch
        run: python scanner/scan.py --daily --budget 7
      - name: Aggiorna archivio completo, risultati e strike rate
        run: python scanner/archive.py
      - name: Commit archivio giornaliero
        run: |
          git config user.name "segnali-bot"
          git config user.email "segnali-bot@users.noreply.github.com"
          git add live/index.html live/data/today.json live/data/archive/
          if git diff --cached --quiet; then echo "nessuna modifica"; exit 0; fi
          git commit -m "live: aggiorna archivio partite $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
