name: Scanner segnali live

# GitHub esegue i cron "*/5" con enormi ritardi (nei log reali: 1 run ogni 40-70 min),
# quindi la finestra 60'-70' veniva quasi sempre saltata. Soluzione: ogni run resta
# attivo ~55 minuti e scansiona in loop ogni 60 s. I cron multipli servono solo a
# "riaccendere" il loop; la concurrency evita due loop in parallelo (il successivo
# parte appena finisce il precedente). Repo pubblico = minuti Actions gratuiti.
on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Invia solo un messaggio Telegram di prova'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scanner/scan.py'
      - '.github/workflows/scan.yml'

permissions:
  contents: write

concurrency:
  group: segnali-live-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      LOOP_MINUTES: '55'
      LOOP_SLEEP: '60'
    steps:
      - uses: actions/checkout@v4
        with:
          # Storia intera: il job spesso parte da uno SHA vecchio (è rimasto in
          # coda) e deve fare rebase sui commit arrivati nel frattempo.
          # Il repo è piccolo; un clone shallow a volte non ha i parent necessari.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Controllo segreti Telegram
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "::error::Secret TELEGRAM_BOT_TOKEN mancante: nessun messaggio Telegram verrà inviato"; fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then echo "::warning::Secret TELEGRAM_CHAT_ID mancante: uso il chat id di default nel codice"; fi

      - name: Test Telegram
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test }}
        run: python scanner/scan.py --ping

      - name: Ripristina cache storici squadre
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.telegram_test) }}
        uses: actions/cache@v4
        with:
          path: scanner/.cache
          key: scan-cache-${{ github.run_id }}
          restore-keys: scan-cache-

      - name: Scansione in loop
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.telegram_test) }}
        run: |
          git config user.name "segnali-bot"
          git config user.email "segnali-bot@users.noreply.github.com"
          # Il cron può aver messo questo run in coda: lo SHA dell'evento è
          # vecchio e state.json non ha i segnali già inviati. Parti da main.
          git fetch origin main
          git checkout -B main origin/main
          end=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            iter_start=$(date +%s)
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort || true
            fi
            ahead=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 1)
            if [ "$ahead" = "0" ]; then
              git fetch -q origin main || echo "::warning::git fetch origin main non riuscito"
              git merge -q --ff-only origin/main || echo "::warning::fast-forward di main non riuscito"
            fi
            python scanner/scan.py || echo "::warning::scan.py terminato con errore"
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort || true
            fi
            git add live/data/signals.json live/data/state.json
            if ! git diff --cached --quiet; then
              git commit -q -m "live: aggiorna segnali $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M')" || echo "::error::git commit dei segnali fallito"
            fi
            ahead=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 1)
            if [ "$ahead" != "0" ]; then
              pushed=0
              for i in 1 2 3; do
                if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then
                  git update-ref refs/remotes/origin/main HEAD || true
                  pushed=1
                  break
                fi
                git rebase --abort 2>/dev/null || true
                echo "::warning::push su main non riuscito (tentativo ${i})"
                sleep 5
              done
              if [ "$pushed" -ne 1 ]; then
                echo "::error::impossibile pubblicare i segnali su main dopo 3 tentativi"
              fi
            fi
            now=$(date +%s)
            if [ "$now" -ge "$end" ]; then break; fi
            remain=$(( end - now ))
            pause=$(( LOOP_SLEEP - (now - iter_start) ))
            if [ "$pause" -gt "$remain" ]; then pause=$remain; fi
            if [ "$pause" -gt 0 ]; then sleep "$pause"; fi
          done
