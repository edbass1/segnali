name: Archivio campionati

# Minuti dei gol da FotMob (anche Serie C e campionati minori) e, di riserva, le tabelle SoccerStats.
# Chi usa il sito non configura nulla: non servono chiavi.
on:
  schedule:
    - cron: '30 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: segnali-soccerstats
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Minuti dei gol, campionati grandi e minori
        run: python3 scanner/fotmob_archive.py --budget 700 --per-league 450
      - name: SoccerStats, solo di riserva
        run: python3 scanner/soccerstats.py || echo "SoccerStats non aggiornato, si usa l'archivio FotMob"
      - name: Pubblica l'archivio
        run: |
          git config user.name "segnali-bot"
          git config user.email "segnali-bot@users.noreply.github.com"
          git add data/soccerstats data/fotmob
          if git diff --cached --quiet; then echo "nessuna modifica"; exit 0; fi
          git commit -m "dati: aggiorna archivio campionati $(date -u '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
