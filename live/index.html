<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segnali Live – Storico gol & xG</title>
<style>
  :root{--bg:#000;--card:#111;--line:#262626;--txt:#f2f2f2;--mut:#9a9a9a;--ok:#22c55e;--ko:#ef4444;--pend:#eab308;--acc:#38bdf8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:18px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{padding:16px 16px 6px;max-width:1000px;margin:auto}
  h1{font-size:28px;margin:0 0 6px}
  a{color:var(--acc)}
  .meta{color:var(--mut);font-size:16px}
  .rules{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:16px}
  .rules b{color:#fff}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;max-width:1000px;margin:8px auto 10px;padding:0 16px}
  .tab{flex:1 1 30%;padding:12px 8px;font-size:18px;font-weight:700;background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:12px;cursor:pointer}
  .tab.on{color:#000;background:#fff;border-color:#fff}
  main{max-width:1000px;margin:0 auto;padding:0 16px 40px}
  .panel{display:none;background:#1c1c1c;border:1px solid var(--line);border-radius:12px;padding:14px}
  .panel.on{display:block}
  .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .box{background:#000;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .box .v{font-size:28px;font-weight:800}.box .l{font-size:14px;color:var(--mut)}
  .sig{background:#000;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
  .sig .m{font-size:21px;font-weight:700}
  .sig .d{color:var(--mut);font-size:15px}
  .sig .r{grid-column:1/3;font-size:16px;color:#d6d6d6}
  .sig .o{grid-row:1/3;grid-column:2;text-align:right;font-size:22px;font-weight:800;white-space:nowrap}
  .won{color:var(--ok)}.lost{color:var(--ko)}.pending{color:var(--pend)}.void{color:var(--mut)}
  .empty{color:var(--mut);padding:20px;text-align:center}
  .tab.day{flex-basis:100%}
  .dmeta{color:#cfcfcf;font-size:16px;margin:0 0 12px}
  .ko{font-size:22px;font-weight:800;color:#fff;margin:18px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .dm{background:#000;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
  .dm.hit{border-color:var(--pend)}
  .dm .m{font-size:21px;font-weight:700}
  .dm .d{color:var(--mut);font-size:15px}
  .dm .r{font-size:16px;color:#d6d6d6;margin-top:4px}
  .badges{margin:8px 0 2px;display:flex;flex-wrap:wrap;gap:6px}
  .bdg{font-size:15px;font-weight:700;padding:4px 10px;border-radius:999px;background:#fff;color:#000;white-space:nowrap}
  .bdg.storico{background:#a78bfa}.bdg.xg{background:#38bdf8}.bdg.segna{background:#22c55e}.bdg.subisce{background:#f97316}.bdg.mai00{background:#f472b6}
  .gotsig{display:inline-block;margin-top:6px;font-size:16px;font-weight:800}
  @media(max-width:600px){body{font-size:17px}.sum{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}.tab{font-size:18px}}
</style>
</head>
<body>
<header>
  <h1>⚽ Segnali Live 0-0</h1>
  <div class="meta">Ultima scansione: <b id="last">–</b> · <a href="../">← Analizzatore alert</a></div>
  <div class="rules" id="rules">Caricamento regole…</div>
</header>
<div class="tabs">
  <button class="tab day" data-t="oggi">📅 Partite del giorno</button>
  <button class="tab on" data-t="storico">📚 Storico senza 0-0</button>
  <button class="tab" data-t="xg">📈 xG</button>
  <button class="tab" data-t="segna">⚽ Segna sempre</button>
  <button class="tab" data-t="subisce">🥅 Subisce sempre</button>
  <button class="tab" data-t="mai00">🚫 Mai 0-0</button>
</div>
<main>
  <section class="panel" id="p-oggi"></section>
  <section class="panel on" id="p-storico"></section>
  <section class="panel" id="p-xg"></section>
  <section class="panel" id="p-segna"></section>
  <section class="panel" id="p-subisce"></section>
  <section class="panel" id="p-mai00"></section>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON={won:'✅',lost:'❌',pending:'⏳',void:'➖'};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  history.replaceState(null,'',b.dataset.t==='oggi'?'#oggi':location.pathname+location.search);
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.t));
});
let DESC={};
function render(id,list){
  const el=document.getElementById('p-'+id);
  const done=list.filter(s=>s.status==='won'||s.status==='lost');
  const won=done.filter(s=>s.status==='won').length;
  const rate=done.length?(100*won/done.length).toFixed(1)+'%':'–';
  let h=(DESC[id]?`<div class="d" style="color:#cfcfcf;margin:0 0 12px;font-size:16px">${DESC[id]}</div>`:'')+`<div class="sum">
    <div class="box"><div class="v">${list.length}</div><div class="l">Segnali</div></div>
    <div class="box"><div class="v won">${won}</div><div class="l">Vinti</div></div>
    <div class="box"><div class="v lost">${done.length-won}</div><div class="l">Persi</div></div>
    <div class="box"><div class="v">${rate}</div><div class="l">Hit rate</div></div></div>`;
  if(!list.length) h+='<div class="empty">Nessun segnale ancora.</div>';
  for(const s of list.slice().reverse()){
    h+=`<div class="sig">
      <div class="m"><a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:#fff;text-decoration:none">${esc(s.home)} – ${esc(s.away)}</a></div>
      <div class="o ${esc(s.status)}">${ICON[s.status]||''} ${esc(s.final||'')}</div>
      <div class="d">${esc(s.time)} · ${esc(s.league)} (${esc(s.country)}) · segnale al ${esc(s.minute)}'</div>
      <div class="r">🎯 ${esc(s.reason)}</div>${s.streak!=null?`<div class="r">🔥 Serie senza 0-0: <b>${s.streak}${s.streak_complete===false?'+':''}</b> partite di campionato consecutive</div>`:''}${('over05' in s)?`<div class="r">💰 Over 0.5 live: <b>${s.over05!=null?Number(s.over05).toFixed(2):'non disponibile'}</b></div>`:''}</div>`;
  }
  el.innerHTML=h;
}
const NAME={storico:'📚 Storico senza 0-0',xg:'📈 xG',segna:'⚽ Segna sempre',subisce:'🥅 Subisce sempre',mai00:'🚫 Mai 0-0'};
const SIDE={home:'Casa',away:'Ospite'};
function badge(t,x){
  if(!x) return `<span class="bdg ${t}">${NAME[t]}</span>`;
  let n='';
  if(t==='storico') n=`serie ${x.streak}${x.complete===false?'+':''} · altra ${x.other_zz} 0-0 su ${x.other_n}`;
  else if(t==='xg') return `<span class="bdg xg">📈 xG atteso ${Number(x.total).toFixed(2)}</span>`;
  else n=`${x.strong_pct}% · altra ${x.other_pct}%`;
  return `<span class="bdg ${t}">${NAME[t]}: ${esc(n)}</span>`;
}
function detail(t,e){
  const x=(e.info||{})[t]; if(!x) return esc((e.reasons||{})[t]||'');
  const s=SIDE[x.strong]||'', o=x.strong==='home'?'Ospite':'Casa';
  if(t==='storico') return `${s}: <b>${x.streak}${x.complete===false?'+':''}</b> partite di campionato consecutive senza 0-0`+
     (x.last00?` (ultimo 0-0: ${esc(x.last00.date)} ${x.last00.home?'vs':'@'} ${esc(x.last00.opp)})`:'')+`; ${o}: <b>${x.other_zz}</b> 0-0 nelle ultime ${x.other_n}`;
  if(t==='xg') return `xG atteso prematch <b>${Number(x.total).toFixed(2)}</b> (casa ${Number(x.exp_home).toFixed(2)} + ospite ${Number(x.exp_away).toFixed(2)}, ${esc(x.method)})`;
  const w={segna:'ha segnato',subisce:'ha subito gol',mai00:'nessuno 0-0'}[t];
  return `${s}: ${w} in <b>${x.strong_k}/${x.strong_n}</b> (${x.strong_pct}%)`+(t==='subisce'?` · ${o}: ${x.other_k}/${x.other_n}`:`; ${o}: ${x.other_k}/${x.other_n} (<b>${x.other_pct}%</b>)`)+` — stagione ${esc(x.season)}`;
}
function renderDay(d,sig){
  const el=document.getElementById('p-oggi');
  if(!d||!d.matches){el.innerHTML='<div class="empty">Lista del giorno non ancora disponibile (viene generata ogni notte a mezzanotte, ora italiana).</div>';return;}
  const dd=d.date?d.date.split('-').reverse().join('/'):'';
  const bySig={};for(const s of sig){(bySig[s.matchId]=bySig[s.matchId]||[]).push(s);}
  const st=d.stats||{};
  // L'archivio conserva le gare concluse; la lista oggi mostra solo quelle non ancora finite.
  const active=d.matches.filter(e=>!e.finished);
  const finishedCount=d.matches.length-active.length;
  const nsig=active.filter(e=>bySig[e.matchId]).length;
  let h=`<div class="dmeta">Partite di campionato di <b>oggi ${esc(dd)}</b> in cui le squadre <b>soddisfano già</b> i requisiti prematch di almeno un segnale: se sono sullo <b>0-0 tra il 60' e il 70'</b> parte il segnale.<br>
    Aggiornato: <b>${esc(d.generated_at)}</b> (ora italiana)${d.partial?' · <span class="pending">lista parziale</span>':''}${st.evaluated!=null?` · ${st.evaluated} partite analizzate`:''}</div>
    <div class="sum">
    <div class="box"><div class="v">${active.length}</div><div class="l">Partite in lista</div></div>
    <div class="box"><div class="v">${st.evaluated??'–'}</div><div class="l">Analizzate</div></div>
    <div class="box"><div class="v pending">${nsig}</div><div class="l">Già segnalate</div></div>
    <div class="box"><div class="v">${esc(dd)}</div><div class="l">Data</div></div></div>`;
  if(finishedCount) h+='<div class="dmeta">'+finishedCount+' partite concluse sono state archiviate.</div>';
  if(!active.length) h+='<div class="empty">Nessuna partita ancora da giocare o in corso soddisfa i requisiti.</div>';
  let last=null;
  for(const e of active){
    if(e.kickoff!==last){h+=`<div class="ko">🕒 ${esc(e.kickoff||'?')}</div>`;last=e.kickoff;}
    const ss=bySig[e.matchId]||[];
    let g='';
    if(ss.length){
      const s=ss[0];
      g=`<div class="gotsig ${esc(s.status)}">🚨 Segnalata al ${esc(s.minute)}' (${ss.map(x=>NAME[x.type]||x.type).join(' + ')}) ${ICON[s.status]||''} ${esc(s.final||'')}</div>`;
    }
    h+=`<div class="dm${ss.length?' hit':''}">
      <div class="m"><a href="${esc(e.url)}" target="_blank" rel="noopener" style="color:#fff;text-decoration:none">${esc(e.home)} – ${esc(e.away)}</a></div>
      <div class="d">${esc(e.kickoff)} · ${esc(e.league)} (${esc(e.country)})</div>
      <div class="badges">${e.types.map(t=>badge(t,(e.info||{})[t])).join('')}</div>
      ${e.types.map(t=>`<div class="r">${NAME[t].split(' ')[0]} ${detail(t,e)}</div>`).join('')}${g}</div>`;
  }
  el.innerHTML=h;
}
function loadData(){
const nc='?t='+Date.now();
Promise.all([fetch('data/signals.json'+nc,{cache:'no-store'}).then(r=>r.json()).catch(()=>[]),
             fetch('data/state.json'+nc,{cache:'no-store'}).then(r=>r.json()).catch(()=>({})),
             fetch('data/today.json'+nc,{cache:'no-store'}).then(r=>r.json()).catch(()=>null)]).then(([sig,st,day])=>{
  renderDay(day,sig);
  if(location.hash==='#oggi') document.querySelector('.tab[data-t="oggi"]').click();
  document.getElementById('last').textContent=(st.last_scan||st.last_write||'–')+' (ora italiana)';
  const r=Object.assign({window:"60-70'",hist_n:50,streak_min:50,hist_max_00:3,xg_min:2.7,cur_min:9,
    segna_strong:100,segna_other:80,subisce:100,mai00_strong:100,mai00_other:90},st.rules||{});
  document.getElementById('rules').innerHTML=
   `Solo partite di <b>campionato nazionale</b> (no coppe, amichevoli, nazionali), sullo <b>0-0</b> tra il <b>${esc(r.window)}</b>.<br>
    📚 <b>Storico senza 0-0</b>: una squadra ha una serie di almeno <b>${r.streak_min} partite di campionato consecutive senza 0-0</b> (over 0.5 gol totali: basta che segni una delle due squadre; stagioni passate incluse, viene mostrata la serie completa), l'altra ha al massimo ${r.hist_max_00} 0-0 nelle ultime ${r.hist_n} di campionato.<br>
    📈 <b>xG</b>: xG totale atteso prematch (stagione corrente) ≥ <b>${r.xg_min}</b>.<br>
    
    ⚽ <b>Segna sempre</b>: una squadra ha <b>segnato</b> almeno 1 gol nel ${r.segna_strong}% delle sue partite, l'altra in almeno il ${r.segna_other}%. <i>(solo campionato in corso, minimo ${r.cur_min} partite per squadra)</i><br>
    🥅 <b>Subisce sempre</b>: una squadra ha <b>subito</b> almeno 1 gol nel ${r.subisce}% delle sue partite. <i>(solo campionato in corso, minimo ${r.cur_min} partite per squadra)</i><br>
    🚫 <b>Mai 0-0</b>: una squadra con <b>over 0.5 gol totali</b> (nessuno 0-0) nel ${r.mai00_strong}% delle partite, l'altra in almeno il ${r.mai00_other}%; inoltre una squadra ha <b>sempre segnato</b> (100% delle partite) e l'altra ha <b>sempre subito gol</b> (100%). <i>(solo campionato in corso, minimo ${r.cur_min} partite per squadra)</i><br>
    Esito: ✅ se arriva almeno un gol dopo il segnale (finale ≠ 0-0), ❌ se finisce 0-0, ⏳ in corso.`;
  DESC={storico:`Serie di almeno ${r.streak_min} partite di campionato consecutive <b>senza 0-0</b> (over 0.5 totali) per una squadra; l'altra max ${r.hist_max_00} 0-0 nelle ultime ${r.hist_n}.`,
    xg:`xG totale atteso prematch ≥ ${r.xg_min} (stagione corrente).`,
    segna:`Una squadra ha <b>segnato</b> in ogni partita di campionato della stagione (${r.segna_strong}%), l'altra ≥ ${r.segna_other}%. <i>(solo campionato in corso, minimo ${r.cur_min} partite per squadra)</i>`,
    subisce:`Una squadra ha <b>subito</b> almeno 1 gol in ogni partita di campionato della stagione (${r.subisce}%). <i>(solo campionato in corso, minimo ${r.cur_min} partite per squadra)</i>`,
    mai00:`Una squadra <b>senza 0-0</b> (over 0.5 totali) nel ${r.mai00_strong}% delle partite di stagione, l'altra ≥ ${r.mai00_other}%; inoltre una squadra ha <b>sempre segnato</b> e l'altra ha <b>sempre subito gol</b> (100%). <i>(solo campionato in corso, minimo ${r.cur_min} partite per squadra)</i>`};
  render('storico',sig.filter(s=>s.type==='storico'));
  for(const t of ['xg','segna','subisce','mai00']) render(t,sig.filter(s=>s.type===t));
});
}
// Rilegge i dati pubblicati ogni 60 secondi, senza ricaricare tutta la pagina.
loadData();
setInterval(loadData, 60 * 1000);
</script>
<script src="archive.js"></script>
</body>
</html>
